name: Build Android APK

# 触发：
#   push 到 main           → 构建；有密钥则签名
#   push tag v*            → 构建 + 创建 GitHub Release
#   pull_request           → 使用公开的开发密钥签名（fork 的 PR 拿不到 Secrets）
#   workflow_dispatch      → 手动，可勾"签名 / 发布 Release"
on:
  push:
    branches: [main]
    tags: ['v*']
    # 纯文档改动不触发 180 分钟构建。tag push 不受 paths 过滤影响，发版仍会触发。
    # 布局：OBS 源码在 obs-studio/ 子目录，依赖/脚本在仓库根。
    paths:
      - 'obs-studio/**'
      - 'deps-android/**'
      - 'scripts/**'
      - 'android-shell/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'obs-studio/**'
      - 'deps-android/**'
      - 'scripts/**'
      - 'android-shell/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      sign:
        description: '用 Secrets 里的密钥签名（需先配好 4 个 Secrets）'
        type: boolean
        default: true
      create_release:
        description: '构建成功后创建 GitHub Release 并上传 APK'
        type: boolean
        default: false

# 同一 ref 的重复触发取消旧任务。tag 不取消：避免发出半截 Release。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: Build arm64-v8a APK
    # Ubuntu 24.04：自带 JDK 17、NDK r30、Android SDK (36/36.0.0) 与 CMake 3.31.6。
    # 由 workflow 开头通过 setup-gradle 锁定 Gradle 版本、aqt 安装并缓存 Qt。
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    # 工作流级只给 read（默认最小权限）；这一级要 write 是因为"打 tag 时创建 Release"
    # 需要 contents:write。只在 push tag（已完成过仓库写权限校验）或手动触发时才会走到发布那一步，
    # PR 事件拿不到这个写权限。
    permissions:
      contents: write

    env:
      # 工具链版本。runner 环境准备在 workflow 开头统一完成；BUILD_TOOLS / PLATFORM 用于配置与签名校验。
      NDK_VERSION: r30
      QT_VERSION: 6.11.1
      GRADLE_VERSION: '9.3.1'
      BUILD_TOOLS: 36.0.0
      PLATFORM: android-36
      # 下载物放到工作区**外**（$GITHUB_WORKSPACE/.. 就是 runner 的 work 目录；
      # job 级 env 里没有 runner.* 上下文，也不能直接写 $GITHUB_WORKSPACE）：
      # 它有几 GB，不能被工作区或缓存打包。
      DL_ROOT: ${{ github.workspace }}/../obs-dl

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install host build tools
        timeout-minutes: 10
        run: |
          # 7-Zip：Ubuntu 24.04 上 **p7zip-full 已变成 transitional 包**，不再提供
          # /usr/bin/7z；提供二进制的是 7zip 包（7z/7za/7zr）。所以这里装 7zip。
          # autoconf/automake/libtool：deps-android 里部分依赖走 autoconf（autoreconf -fi），缺了会直接失败。
          # 基础包大多已预装在 runner 镜像中（apt 会直接跳过，几乎零耗时），显式保留以避免镜像调整导致缺失；
          # 仅去掉 arm64 打包用不到的 x86 汇编器 nasm/yasm。
          host_packages=(
            7zip ninja-build build-essential curl unzip zip ca-certificates
            patch pkg-config dpkg-dev autoconf automake libtool ccache
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev python3-pil
          )
          apt_network_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          fetch_host_packages() {
            sudo timeout -k 5s 90s apt-get "${apt_network_options[@]}" update --error-on=any &&
              sudo timeout -k 5s 150s apt-get "${apt_network_options[@]}" install \
                -y --no-install-recommends --download-only "${host_packages[@]}"
          }
          if ! fetch_host_packages; then
            echo "::warning::Ubuntu mirror update or download failed. Retrying with archive.ubuntu.com."
            sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
            fetch_host_packages
          fi
          # 下载完成后再运行 dpkg，避免下载超时中断包安装。
          sudo apt-get install -y --no-install-recommends --no-download "${host_packages[@]}"
          # 确认解包器真的在（脚本也会自己找一遍；早点失败更好定位）
          for c in 7z 7zz 7za 7zr; do command -v "$c" >/dev/null 2>&1 && { echo "7-Zip: $c"; break; }; done
          # 确认 autoreconf 就位（依赖构建的硬前提）
          autoreconf --version | head -1

      - name: Cache Qt toolchain
        uses: actions/cache@v4
        with:
          path: ~/Qt
          key: obsqt-v2-${{ runner.os }}-qt${{ env.QT_VERSION }}

      - name: Install Qt toolchain
        run: |
          set -euo pipefail
          QT_DIR="$HOME/Qt/$QT_VERSION"
          if [ -x "$QT_DIR/gcc_64/bin/androiddeployqt" ]; then
            echo "Qt 已就位：$QT_DIR"
            exit 0
          fi
          pip install --quiet aqtinstall
          mkdir -p "$HOME/Qt"
          aqt install-qt all_os android "$QT_VERSION" android_arm64_v8a -O "$HOME/Qt"
          aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O "$HOME/Qt"
          [ -x "$QT_DIR/gcc_64/bin/androiddeployqt" ] || {
            echo "FATAL: Qt 宿主缺 androiddeployqt（aqt 安装不完整？）" >&2
            exit 1
          }

      # ---- ccache：编译对象缓存（deps 与主构建共用一份） ----
      # key 带 sha + run_attempt：同一提交的手动 re-run 不会因 immutable key 报
      # Cache save failed；restore-keys 前缀不含 sha/attempt，历史缓存仍可命中。
      - name: Cache ccache objects
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: obsccache-${{ runner.os }}-ndk${{ env.NDK_VERSION }}-qt${{ env.QT_VERSION }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            obsccache-${{ runner.os }}-ndk${{ env.NDK_VERSION }}-qt${{ env.QT_VERSION }}-

      - name: Run Android host checks
        run: |
          echo "::group::Responsive Android layout policy"
          c++ -std=c++17 -Wall -Wextra -Werror scripts/android-layout-test/policy.cpp -o "$RUNNER_TEMP/android-layout-test"
          "$RUNNER_TEMP/android-layout-test"
          echo "::endgroup::"

          echo "::group::UVC transport and recovery"
          bash scripts/test-android-uvc.sh
          echo "::endgroup::"

          echo "::group::Android IME focus policy"
          mkdir -p "$RUNNER_TEMP/obs-ime-policy"
          javac -d "$RUNNER_TEMP/obs-ime-policy" \
            obs-studio/frontend/cmake/android/java/com/obsproject/studio/ObsImeFocus.java \
            scripts/qt-android-ime/ObsImeFocusTest.java
          java -ea -cp "$RUNNER_TEMP/obs-ime-policy" ObsImeFocusTest
          echo "::endgroup::"

      # ---- 依赖缓存：最慢的一环（FFmpeg + 13 个依赖）----
      # 键里带 versions.sh/defs.sh/ffmpeg 补丁的内容哈希：依赖定义一变缓存即失效，
      # 避免"用了旧二进制却以为源码编译过了"。
      - name: Compute dependency cache key
        id: depkey
        run: |
          set -euo pipefail
          HASH="$(cat deps-android/versions.sh deps-android/defs.sh deps-android/build.sh \
                  scripts/android-native-deps/ffmpeg-*.patch scripts/android-native-deps/x265-*.patch \
                  scripts/relocate-android-pkgconfig.sh | sha256sum | cut -c1-16)"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "依赖缓存键哈希=$HASH"

      - name: Cache dependency sources and prebuilt libs
        uses: actions/cache@v4
        with:
          path: |
            deps-android/src
            deps-android/prebuilt
          key: obsdeps-${{ runner.os }}-ndk${{ env.NDK_VERSION }}-${{ steps.depkey.outputs.hash }}

      # 独立一步恢复密钥：这样"有没有密钥"的判断只在一处，构建步骤里不再套条件表达式。
      - name: Restore signing keystore from secrets
        id: keystore
        if: |
          github.event_name != 'pull_request' &&
          (github.event_name != 'workflow_dispatch' || inputs.sign)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "未配置 ANDROID_KEYSTORE_BASE64 —— 本次将只产出未签名 APK"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # tr -d 去掉换行：粘贴 Secrets 时很容易带回车，解码出来就是坏文件。
          printf '%s' "$KEYSTORE_B64" | tr -d '\n\r' | base64 -d > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
          # 立刻验一次：口令错/文件坏在这里暴露，而不是等到最后签名那一步。
          keytool -list -keystore "$RUNNER_TEMP/release.jks" \
            -storepass:env STORE_PASS \
            -alias "$KEY_ALIAS" >/dev/null
          echo "密钥库可用"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          SIGN_KEYSTORE: ${{ github.event_name == 'pull_request' && format('{0}/android-shell/debug.keystore', github.workspace) || (steps.keystore.outputs.available == 'true' && format('{0}/release.jks', runner.temp) || '') }}
          SIGN_KEY_ALIAS: ${{ github.event_name == 'pull_request' && 'androiddebugkey' || secrets.ANDROID_KEY_ALIAS }}
          SIGN_STORE_PASS: ${{ github.event_name == 'pull_request' && 'android' || secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGN_KEY_PASS: ${{ github.event_name == 'pull_request' && 'android' || secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/ci-build-android.sh

      - name: Check document images and encoder backpressure on host
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/test-image-document.py --ffmpeg-prefix /usr
          cc -std=c11 -Wall -Wextra -Werror scripts/ffmpeg-submit-test/test.c -o "$RUNNER_TEMP/ffmpeg-submit-test"
          "$RUNNER_TEMP/ffmpeg-submit-test"

      - name: Check property editor diagnostics with host Qt
        run: |
          set -euo pipefail
          HOST_QT="$HOME/Qt/$QT_VERSION/gcc_64"
          CMAKE_BIN="$(command -v cmake)"
          CTEST_BIN="$(command -v ctest)"
          "$CMAKE_BIN" -S scripts/ime-diagnostics-test -B "$RUNNER_TEMP/obs-ime-test" -G Ninja \
            -DCMAKE_PREFIX_PATH="$HOST_QT" -DCMAKE_BUILD_TYPE=Release
          "$CMAKE_BIN" --build "$RUNNER_TEMP/obs-ime-test" --parallel 2
          QT_QPA_PLATFORM=offscreen QT_PLUGIN_PATH="$HOST_QT/plugins" \
            LD_LIBRARY_PATH="$HOST_QT/lib:${LD_LIBRARY_PATH:-}" \
            "$CTEST_BIN" --test-dir "$RUNNER_TEMP/obs-ime-test" --output-on-failure

      - name: Locate APK and checksum
        id: apk
        run: |
          set -euo pipefail
          # 脚本把最终产物路径写在这个文件里（签名过就是签名包，否则是未签名包）。
          APK_FILE="$(cat build-fe-arm64-v8a-ci/.final-apk-path)"
          [ -f "$APK_FILE" ] || { echo "FATAL: 路径文件指向的 APK 不存在：$APK_FILE"; exit 1; }
          SHA="$(sha256sum "$APK_FILE" | cut -d' ' -f1)"
          SIZE="$(stat -c %s "$APK_FILE")"
          # 判定"是否签名"要按**文件名精确比对**，不能用 *release.apk 这类通配：
          # 未签名包的路径里也常含 "release"（.../outputs/apk/release/xxx-unsigned.apk），
          # 通配会把未签名的包误判成已签名，进而把一个装不上的包发成 Release。
          SIGNED="no"
          if [ "$(basename "$APK_FILE")" = "OBS-Android-arm64-v8a-release.apk" ]; then
            SIGNED="yes"
          fi
          {
            echo "path=$APK_FILE"
            echo "name=$(basename "$APK_FILE")"
            echo "sha256=$SHA"
            echo "signed=$SIGNED"
          } >> "$GITHUB_OUTPUT"
          echo "APK       : $APK_FILE"
          echo "SHA-256   : $SHA"
          echo "签名      : $SIGNED"
          {
            echo "### APK 构建完成"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 文件 | \`$(basename "$APK_FILE")\` |"
            echo "| SHA-256 | \`$SHA\` |"
            echo "| 大小 | $SIZE 字节 |"
            echo "| 已签名 | $SIGNED |"
            echo "| ABI / API | arm64-v8a / minSdk 29 |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-android-apk-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        # 只在打 v* tag 时发布（手动触发要先勾 create_release）；
        # 且必须真的签过名 —— 发一个装不上的包比不发更糟。
        if: |
          steps.apk.outputs.signed == 'yes' &&
          (startsWith(github.ref, 'refs/tags/v') ||
           (github.event_name == 'workflow_dispatch' && inputs.create_release))
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          body: |
            OBS for Android —— arm64-v8a 自签名 release 包（用仓库维护者自己的密钥签名）。

            | 项 | 值 |
            | --- | --- |
            | 文件 | `${{ steps.apk.outputs.name }}` |
            | SHA-256 | `${{ steps.apk.outputs.sha256 }}` |

            安装：`adb install -r <apk>`。此包与仓库里的 debug 测试包**签名不同**，
            覆盖安装前请先备份配置（跨签名升级需要先卸载，用户数据会丢）。

            未在真机验证的范围见仓库 README 的 Limitations 一节。
          fail_on_unmatched_files: true

      # ---- 失败诊断：跑挂时把能定位问题的碎片留下来 ----
      # 构建脚本 500 行、单次 10+ 分钟，失败后翻 16k 行日志成本太高。
      - name: 失败时上传构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_attempt }}
          path: |
            build-fe-*/CMakeFiles/CMakeConfigureLog.yaml
            build-fe-*/CMakeCache.txt
            build-fe-*/CMakeFiles/CMakeOutput.log
            build-fe-*/CMakeFiles/CMakeError.log
            build-fe-*/frontend/android-*-deployment-settings.json
            build-fe-*/frontend/android-build/build.gradle
            build-fe-*/frontend/android-build/build/outputs/logs/*.txt
            build-fe-*/.final-apk-path
          if-no-files-found: warn
          retention-days: 7

      - name: 失败时诊断
        if: failure()
        run: |
          {
            echo "=== Qt 目录 ==="
            ls -1 "$HOME/Qt" 2>/dev/null || true
            echo "=== SDK 平台 / build-tools ==="
            for sdk_dir in "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk; do
              [ -d "$sdk_dir" ] || continue
              echo "--- $sdk_dir ---"
              ls -1 "$sdk_dir/platforms" "$sdk_dir/build-tools" 2>/dev/null || true
              break
            done
            echo "=== CMake 配置日志尾部 ==="
            for f in build-fe-*/CMakeFiles/CMakeConfigureLog.yaml build-fe-*/CMakeFiles/CMakeError.log; do
              [ -f "$f" ] || continue
              echo "--- $f"
              tail -n 60 "$f" || true
            done
            echo "=== deployment settings ==="
            for f in build-fe-*/frontend/android-*-deployment-settings.json; do
              [ -f "$f" ] || continue
              echo "--- $f"
              grep -E 'android-platform|sdk|target|min' "$f" || true
            done
            echo "=== 磁盘 ==="
            df -h / 2>/dev/null || true
            du -sh "$HOME/Qt" "$DL_ROOT" 2>/dev/null || true
          } | tee diagnostics.txt
          echo "::group::失败诊断摘要"
          cat diagnostics.txt
          echo "::endgroup::"

      - name: 失败时上传诊断摘要
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.run_attempt }}
          path: diagnostics.txt
          if-no-files-found: warn
          retention-days: 7
